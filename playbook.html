<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="js/gate.js?v=anim2-20260828"></script>
  <title>Plays — Cy-Fair K/1 Lions</title>
  <meta name="description" content="Twelve coach-sheet plays for the Cy-Fair K/1 Lions.">
  <link rel="stylesheet" href="css/styles.css?v=anim2-20260828">
</head>
<body class="playbook-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="mast"></header>

  <main id="main" class="playbook-stage">
    <nav class="play-strip" aria-label="Choose a play">
      <div class="btn-grid">
        <button class="play-btn is-active active" type="button" data-run-key="play-01" aria-pressed="true" aria-label="Play 1 Pass Right"><span class="btn-num">1</span><span class="btn-call">Pass R</span></button>
        <button class="play-btn" type="button" data-run-key="play-02" aria-pressed="false" aria-label="Play 2 Pass Left"><span class="btn-num">2</span><span class="btn-call">Pass L</span></button>
        <button class="play-btn" type="button" data-run-key="play-03" aria-pressed="false" aria-label="Play 3 Wingback Left Sweep"><span class="btn-num">3</span><span class="btn-call">Wing L</span></button>
        <button class="play-btn" type="button" data-run-key="play-04" aria-pressed="false" aria-label="Play 4 Wingback Right Sweep"><span class="btn-num">4</span><span class="btn-call">Wing R</span></button>
        <button class="play-btn" type="button" data-run-key="play-05" aria-pressed="false" aria-label="Play 5 RB Dive Left"><span class="btn-num">5</span><span class="btn-call">Dive L</span></button>
        <button class="play-btn" type="button" data-run-key="play-06" aria-pressed="false" aria-label="Play 6 RB Dive Right"><span class="btn-num">6</span><span class="btn-call">Dive R</span></button>
        <button class="play-btn" type="button" data-run-key="play-07" aria-pressed="false" aria-label="Play 7 Fake Handoff Left Sweep"><span class="btn-num">7</span><span class="btn-call">Fake L</span></button>
        <button class="play-btn" type="button" data-run-key="play-08" aria-pressed="false" aria-label="Play 8 Fake Handoff Right Sweep"><span class="btn-num">8</span><span class="btn-call">Fake R</span></button>
        <button class="play-btn" type="button" data-run-key="play-09" aria-pressed="false" aria-label="Play 9 Handoff Weak Left Sweep"><span class="btn-num">9</span><span class="btn-call">Weak L</span></button>
        <button class="play-btn" type="button" data-run-key="play-10" aria-pressed="false" aria-label="Play 10 Handoff Weak Right Sweep"><span class="btn-num">10</span><span class="btn-call">Weak R</span></button>
        <button class="play-btn" type="button" data-run-key="play-11" aria-pressed="false" aria-label="Play 11 RB Left Sweep"><span class="btn-num">11</span><span class="btn-call">Sweep L</span></button>
        <button class="play-btn" type="button" data-run-key="play-12" aria-pressed="false" aria-label="Play 12 RB Right Sweep"><span class="btn-num">12</span><span class="btn-call">Sweep R</span></button>
      </div>
    </nav>

    <section class="play-teacher">
      <figure class="proof-pane proof-live-pane">
        <div id="sim-root" class="sim-root"></div>
        <div id="sim-beats" class="sim-beats" role="tablist" aria-label="Play beats"></div>
        <p id="sim-cue" class="sim-cue" aria-live="polite">Find your circle. Two-point stance. Eyes up. Tap a player.</p>
        <div class="sim-controls">
          <button type="button" class="hud-ghost" id="sim-reset" aria-label="Reset">Reset</button>
          <button type="button" class="hud-play" id="sim-play">Play</button>
          <button type="button" class="hud-ghost" id="sim-gif">GIF</button>
          <button type="button" id="sim-back" hidden>Back</button>
          <button type="button" id="sim-next" hidden>Next</button>
        </div>
      </figure>
      <figure class="proof-pane proof-photo-pane" id="sheet-pane">
        <img id="coach-sheet-photo" src="plays/play-01.jpg" alt="Coach sheet for Play 1 Pass Right">
      </figure>
      <span id="sim-play-name" hidden>Play 1</span>
      <span id="sim-play-badge" hidden>Pass Right</span>
    </section>

    <section class="jobs-strip" aria-label="Jobs">
      <div id="sim-assignments" class="assignment-board"></div>
    </section>

    <details class="playbook-more playbook-coach-controls">
      <summary>Speed</summary>
      <div class="look-toggle" role="group" aria-label="Speed">
        <button type="button" class="btn btn-secondary is-active" data-sim-speed="slow" aria-pressed="true">Slow-Mo</button>
        <button type="button" class="btn btn-secondary" data-sim-speed="normal" aria-pressed="false">Normal</button>
        <button type="button" class="btn btn-secondary" data-sim-speed="fast" aria-pressed="false">Fast</button>
      </div>
      <label class="tiny sim-scrub">Scrub
        <input id="sim-slider" type="range" min="0" max="6" value="0" step="0.02" aria-label="Scrub through play">
      </label>
    </details>
  </main>

  <script src="js/play-gif.js?v=anim2-20260828"></script>
  <script src="js/plays-data.js?v=anim2-20260828"></script>
  <script src="js/sim.js?v=anim2-20260828"></script>
  <script src="js/app.js?v=anim2-20260828"></script>
</body>
</html>
